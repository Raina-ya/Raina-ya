<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Research arc: benchmark, detect, decide" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#140d33"/></linearGradient>
  <linearGradient id="lk0" x1="0" x2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="lk1" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
</defs>
<style>
  .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-12}}
  .beat{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes beat{50%{transform:scale(1.7);opacity:.4}}
  .in0{animation:up .8s} .in1{animation:up 1.05s} .in2{animation:up 1.3s}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
</style>
<rect width="1200" height="250" rx="18" fill="url(#bg)"/>
<line x1="374" y1="125.0" x2="423" y2="125.0" stroke="url(#lk0)" stroke-width="2.5" class="flow"/><path d="M421,119.0 L431,125.0 L421,131.0" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/><circle r="4" fill="#fff"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M374,125.0 L425,125.0"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><line x1="769" y1="125.0" x2="818" y2="125.0" stroke="url(#lk1)" stroke-width="2.5" class="flow"/><path d="M816,119.0 L826,125.0 L816,131.0" fill="none" stroke="#f0abfc" stroke-width="2.5" stroke-linecap="round"/><circle r="4" fill="#fff"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M769,125.0 L820,125.0"/><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>

  <g class="in0">
    <rect x="40" y="40" width="330" height="170" rx="14" fill="#111831" stroke="#5eead4" stroke-opacity=".45"/>
    <rect x="40" y="40" width="5" height="170" rx="2.5" fill="#5eead4"/>
    <text x="66" y="76" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#5eead4" letter-spacing="2">01 · BENCHMARK</text>
    <text x="66" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e6edf3">adaptive-qem-benchmark</text>
    <text x="66" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">When does error mitigation</text>
    <text x="66" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">actually help?</text>
    <rect x="66" y="176" width="161" height="22" rx="11" fill="#5eead4" fill-opacity=".14" stroke="#5eead4" stroke-opacity=".5"/>
    <circle cx="78" cy="187" r="4" fill="#5eead4"/>
    <text x="90" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#5eead4">Verified results</text>
  </g>
  <g class="in1">
    <rect x="435" y="40" width="330" height="170" rx="14" fill="#111831" stroke="#a78bfa" stroke-opacity=".45"/>
    <rect x="435" y="40" width="5" height="170" rx="2.5" fill="#a78bfa"/>
    <text x="461" y="76" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#a78bfa" letter-spacing="2">02 · DETECT</text>
    <text x="461" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e6edf3">bias-probe-visibility</text>
    <text x="461" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Can a wrong, certified decision</text>
    <text x="461" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">be caught at runtime?</text>
    <rect x="461" y="176" width="153" height="22" rx="11" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/>
    <circle cx="473" cy="187" r="4" fill="#a78bfa"/>
    <text x="485" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#a78bfa">Complete · v1.1</text>
  </g>
  <g class="in2">
    <rect x="830" y="40" width="330" height="170" rx="14" fill="#111831" stroke="#f0abfc" stroke-opacity=".45"/>
    <rect x="830" y="40" width="5" height="170" rx="2.5" fill="#f0abfc"/>
    <text x="856" y="76" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#f0abfc" letter-spacing="2">03 · DECIDE</text>
    <text x="856" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="18" font-weight="700" fill="#e6edf3">sense-correct-abstain</text>
    <text x="856" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">Trust, correct, or abstain —</text>
    <text x="856" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9aa4b2">under a fixed budget?</text>
    <rect x="856" y="176" width="169" height="22" rx="11" fill="#f0abfc" fill-opacity=".14" stroke="#f0abfc" stroke-opacity=".5"/>
    <circle cx="868" cy="187" r="4" fill="#f0abfc" class="beat"/>
    <text x="880" y="192" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#f0abfc">Planning · Gate 1</text>
  </g>
<text x="600.0" y="236" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#9aa4b2" opacity=".8">each project starts from the question the previous one could not answer</text>
<rect x=".5" y=".5" width="1199" height="249" rx="18" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
