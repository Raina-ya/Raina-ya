<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="adaptive-qem-benchmark: When does quantum error mitigation help, waste a fixed shot budget, or fail outright?" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
