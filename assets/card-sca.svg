    <text x="338.0" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9aa4b2">no action · recalibrate · abstain</text>
  </g>
  <g class="t">
    <rect x="608.0" y="118" width="272.0" height="84" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="626.0" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#f0abfc">RC labels</text>
    <text x="626.0" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9aa4b2">randomized compiling as the probe</text>
  </g>
  <g class="t">
    <rect x="896.0" y="118" width="272.0" height="84" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="914.0" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#f0abfc">0 runs</text>
    <text x="914.0" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9aa4b2">no experiment before the gate</text>
  </g>
  <text x="32" y="230" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b2" opacity=".75">simulation-first · hardware only as a registered addendum · theorem proofs are drafts until stated otherwise</text>
</g>
<rect x=".5" y=".5" width="1199" height="249" rx="16" fill="none" stroke="#f0abfc" stroke-opacity=".3"/>
