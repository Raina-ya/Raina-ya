<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="sense-correct-abstain: Under a fixed budget, when is runtime evidence enough to trust, correct, or withhold a QAOA decision?" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1326"/><stop offset="1" stop-color="#150f30"/></linearGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="1200" height="250" rx="16"/></clipPath>
</defs>
<style>

  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sheen{animation:sweep 7s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-500px)}60%,100%{transform:translateX(1400px)}}
  .beat{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes beat{50%{transform:scale(1.7);opacity:.4}}
</style>
<g clip-path="url(#c)">
  <rect width="1200" height="250" fill="url(#bg)"/>
  <rect class="sheen" x="0" y="0" width="300" height="250" fill="url(#sheen)"/>
  <rect width="1200" height="4" fill="#f0abfc"/>
  <text x="32" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#f0abfc" letter-spacing="2">03 DECIDE · IN PROGRESS</text>
  <text x="32" y="80" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#e6edf3">sense-correct-abstain</text>
  <rect x="1029" y="28" width="139" height="26" rx="13" fill="#f0abfc" fill-opacity=".14" stroke="#f0abfc" stroke-opacity=".55"/>
  <circle cx="1044" cy="41" r="4.5" fill="#f0abfc" class="beat"/>
  <text x="1057" y="46" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#f0abfc">Planning · M3</text>
  <text x="32" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-style="italic" fill="#9aa4b2">Under a fixed budget, when is runtime evidence enough to trust, correct, or withhold a QAOA decision?</text>
  
  <g class="t">
    <rect x="32.0" y="118" width="272.0" height="84" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="50.0" y="154" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="22" font-weight="700" fill="#f0abfc">Gate 1</text>
    <text x="50.0" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#9aa4b2">design locked · 2026-11-20</text>
  </g>
  <g class="t">
    <rect x="320.0" y="118" width="272.0" height="84" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/>
